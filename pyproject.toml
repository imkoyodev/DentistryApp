[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "dentistryapp"
version = "0.0.1"
description = "Practical workshop for the Programming II course of the Faculty of Sciences and Engineering"
authors = [
  { name = "Juan Camilo Hernandez Diaz" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["dentistryapp"]
include = ["pyproject.toml", "dentistryapp/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["dentistryapp"]
force-sort-within-sections = true

